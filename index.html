<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aplikasi Rapor</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--n:#0F1B33;--n2:#1B2A49;--g:#D9B96E;--g2:#F3DFA8;--bg:#F6F3EC;--ok:#2A9D8F;--er:#D1495B}
*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:var(--bg);color:#1c2433}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif}
.gold{background:linear-gradient(90deg,#B8913F,#F3DFA8,#B8913F);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}@keyframes float{50%{transform:translateY(-14px)}}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes orb{50%{transform:translate(30px,-40px) scale(1.15)}}@keyframes tin{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}@keyframes prog{from{width:100%}to{width:0}}@keyframes spin{to{transform:rotate(360deg)}}
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.hero{background:radial-gradient(circle at 30% 20%,#27407A,var(--n) 60%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;position:relative;overflow:hidden}
.hero .o{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:orb 9s ease-in-out infinite}
.hero img{width:210px;filter:drop-shadow(0 10px 30px #D9B96E88);animation:float 5s ease-in-out infinite;position:relative}
.hero h1{font-size:38px;margin:22px 0 6px;position:relative}.hero p{color:#c9d3ea;max-width:340px;position:relative;line-height:1.6}
.panel{display:flex;align-items:center;justify-content:center;padding:30px}.box{width:100%;max-width:430px;animation:up .6s both}
.tabs{display:flex;background:#e9e4d6;border-radius:12px;padding:4px;margin-bottom:20px}.tabs button{flex:1;border:0;background:0;padding:10px;border-radius:9px;cursor:pointer;font-weight:700;color:#6b6450;transition:.25s}.tabs button.on{background:#fff;color:var(--n);box-shadow:0 2px 8px #0002}
label{display:block;font-size:12px;font-weight:700;color:var(--n2);margin:12px 0 4px}
.inp,select{width:100%;padding:11px 12px;border:1.5px solid #d8d2c0;border-radius:10px;background:#fff;font:inherit;transition:.2s}.inp:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px #D9B96E44}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sm{display:flex;gap:8px;margin:12px 0 4px}.sm label{flex:1;margin:0;border:1.5px solid #d8d2c0;border-radius:10px;padding:9px;text-align:center;cursor:pointer;font-weight:500;background:#fff}.sm input{display:none}.sm input:checked+span{color:var(--n);font-weight:700}.sm label:has(input:checked){border-color:var(--g);background:#FFF8E6}
.btn{border:0;border-radius:11px;padding:12px 20px;font:700 14px Inter,Arial,sans-serif;cursor:pointer;color:var(--n);background:linear-gradient(135deg,#F3DFA8,#D9B96E);box-shadow:0 6px 16px #D9B96E55;transition:.2s;position:relative}.btn:hover{transform:translateY(-2px)}.btn.w{width:100%;margin-top:18px}
.btn.o{background:#fff;box-shadow:none;border:1.5px solid #d8d2c0}.btn.s{padding:7px 12px;font-size:12px;box-shadow:none}.btn.r{background:var(--er);color:#fff;box-shadow:none}.btn.k{background:var(--ok);color:#fff;box-shadow:none}
.btn.ld{pointer-events:none;color:transparent}.btn.ld::after{content:'';position:absolute;inset:0;margin:auto;width:18px;height:18px;border:3px solid var(--n);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.sec{text-align:center;padding:10px 0;animation:up .5s both}.sec .ic{font-size:54px}
header{background:var(--n);display:flex;align-items:center;gap:12px;padding:10px 22px;border-bottom:3px solid var(--g);position:sticky;top:0;z-index:20}
header img{height:38px}header h1{margin:0;font-size:21px;flex:1}.chip{color:#fff;font-size:12px;text-align:right;line-height:1.35}.chip small{color:var(--g)}
.bell{position:relative;background:#ffffff18;border:0;color:#fff;font-size:18px;border-radius:50%;width:38px;height:38px;cursor:pointer}.bell b{position:absolute;top:-3px;right:-3px;background:var(--er);font-size:10px;border-radius:10px;padding:2px 5px}
#nt{position:absolute;right:70px;top:58px;width:330px;max-height:380px;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 40px #0004;display:none;z-index:30}#nt div{padding:11px 14px;border-bottom:1px solid #eee;font-size:13px}#nt .u{background:#FFF8E6}#nt small{color:#888;display:block}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 22px;background:#fff;border-bottom:1px solid #e5dfcd}nav button{border:0;background:#f1ede1;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:500;transition:.2s}nav button.on{background:var(--n);color:var(--g2);font-weight:700}
main{max-width:1100px;margin:auto;padding:22px;animation:up .45s both}h2{color:var(--n);margin:0 0 6px;font-size:26px}.sub{color:#6b6450;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001;cursor:pointer;border:1px solid #eee7d3;transition:.25s;animation:up .5s both}.card:hover{transform:translateY(-5px);box-shadow:0 12px 28px #D9B96E44;border-color:var(--g)}.card .ic{font-size:34px}.card h3{margin:10px 0 4px;color:var(--n)}.card p{margin:0;color:#6b6450;font-size:13px}
.tw{overflow:auto;background:#fff;border-radius:14px;box-shadow:0 3px 14px #0001}table{border-collapse:collapse;width:100%}th{background:var(--n);color:var(--g2);padding:10px;font-size:12px;text-align:left}td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:middle}td small{display:block;color:#888}td .inp{padding:6px 8px;min-width:120px}
.bd{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}.bd.approved{background:#d6f3ee;color:#17776c}.bd.pending{background:#fff0c9;color:#936c00}.bd.rejected{background:#fbdce1;color:#a82a3d}
.form{background:#fff;border-radius:16px;padding:24px;max-width:560px;box-shadow:0 3px 14px #0001}
#toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:10px}.toast{width:320px;background:#fff;border-radius:12px;padding:13px 15px;box-shadow:0 10px 30px #0003;display:flex;gap:11px;border-left:5px solid var(--ok);animation:tin .4s both;position:relative;overflow:hidden}.toast.err{border-color:var(--er)}.toast.inf{border-color:var(--g)}.toast i{font-style:normal;font-size:20px}.toast b{display:block;color:var(--n)}.toast span{font-size:12px;color:#555}.toast u{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.35;animation:prog 4.6s linear both}
#modal{position:fixed;inset:0;background:#0F1B3399;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#modal .m{background:#fff;border-radius:18px;max-width:480px;padding:26px;animation:up .35s both}
@media(max-width:800px){.auth{grid-template-columns:1fr}.hero{padding:24px}.hero img{width:120px}.hero h1{font-size:26px}#nt{right:10px;width:calc(100% - 20px)}}
</style></head><body><div id="root"></div><div id="toasts"></div><div id="modal"></div>
<script>
const CFG={API:'https://script.google.com/macros/s/AKfycbyxzVD07M1KhJplC-6d53LZ2crSyt8CIIhiui9rQCExNRo4k6UkHe1oso_rbWJO40nE/exec',CID:'116845895734-6nu3hepns2alartgfpvmbvc3biul7hvf.apps.googleusercontent.com'};
const SCOPE='https://www.googleapis.com/auth/drive.file openid email',FASE={I:'A',II:'A',III:'B',IV:'B',V:'C',VI:'C'},RL={admin_app:'Admin Aplikasi',admin_sekolah:'Admin Sekolah',user:'Pengguna'};
const HD={Profil:['key','value'],Siswa:['id','nama','nis','nisn','jk','agama','ortu'],Mapel:['kode','nama','kkm','tp1','tp2','tp3','tp4'],Nilai:['sid','mapel','tp1','tp2','tp3','tp4','sas'],Kegiatan:['no','tema','dim1','dim2','desk'],Catatan:['sid','sakit','izin','alpa','ekskul','pekskul','k1','k2','k3','catatan']};
const MAPEL=['Pendidikan Agama dan Budi Pekerti','Pendidikan Pancasila','Bahasa Indonesia','Matematika','IPAS','Seni dan Budaya','PJOK','Bahasa Inggris','Muatan Lokal'];
const MN=[['buat','Buat Raport','✨','Buat raport baru. Data tersimpan otomatis di Google Sheet Anda.',['admin_app','admin_sekolah','user']],['saya','Kelola Raport Saya','📂','Buka dan kelola raport yang pernah dibuat.',['admin_app','admin_sekolah','user']],['app','Kelola Aplikasi','🛠️','Semua sekolah, pengguna, persetujuan, dan peran admin.',['admin_app']],['sek','Kelola Sekolah Saya','🏫','Pengguna sekolah Anda, password, dan persetujuan pendaftar.',['admin_app','admin_sekolah']]];
const $=q=>document.querySelector(q),esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let U=JSON.parse(sessionStorage.u||'null'),PW=sessionStorage.p||'',view='home',seen=null,NT=[],timer;
async function api(a,d={}){const r=await fetch(CFG.API,{method:'POST',body:JSON.stringify({action:a,email:U&&U.email,password:PW,...d})}),j=await r.json();if(j.error)throw new Error(j.error);return j}
function toast(t,title,msg){const e=document.createElement('div');e.className='toast '+t;e.innerHTML=`<i>${{ok:'✅',err:'⛔',inf:'🔔'}[t]}</i><div><b>${esc(title)}</b><span>${esc(msg||'')}</span></div><u></u>`;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4700)}
async function run(b,fn){b.classList.add('ld');try{await fn()}catch(e){toast('err','Gagal',e.message)}finally{b.classList.remove('ld')}}
const modal=h=>{$('#modal').innerHTML='<div class="m">'+h+'</div>';$('#modal').style.display='flex'},unmodal=()=>$('#modal').style.display='none';
/* ---------- AUTH ---------- */
function authView(tab){$('#root').innerHTML=`<div class="auth"><div class="hero"><i class="o" style="width:300px;height:300px;background:#D9B96E;top:-80px;left:-60px"></i><i class="o" style="width:260px;height:260px;background:#3A5BA8;bottom:-60px;right:-40px;animation-delay:-4s"></i><img src="logo.png" alt=""><h1 class="gold">Aplikasi Rapor</h1><p>Rapor Kurikulum Merdeka yang rapi, aman, dan tersimpan di Google Sheet Anda sendiri.</p></div>
<div class="panel"><div class="box"><div class="tabs"><button data-t="in" class="${tab=='in'?'on':''}">Masuk</button><button data-t="up" class="${tab=='up'?'on':''}">Daftar</button></div><div id="af"></div></div></div></div>`;
 $('#af').innerHTML=tab=='in'?`<h2 class="serif">Selamat datang</h2><p class="sub">Masuk dengan email terdaftar.</p><label>Email</label><input class="inp" id="e" type="email" autocomplete="username"><label>Password</label><input class="inp" id="p" type="password" autocomplete="current-password"><button class="btn w" id="go">Masuk</button>`
 :`<h2 class="serif">Buat akun</h2><p class="sub">Pendaftaran perlu disetujui admin sebelum bisa masuk.</p><label>Nama lengkap</label><input class="inp" id="n"><div class="row2"><div><label>Email</label><input class="inp" id="e" type="email" autocomplete="username"></div><div><label>No. HP / WhatsApp</label><input class="inp" id="h" type="tel"></div></div><label>NIP (opsional)</label><input class="inp" id="nip">
 <label>Sekolah</label><div class="sm"><label><input type="radio" name="sm" value="p" checked><span>Pilih terdaftar</span></label><label><input type="radio" name="sm" value="b"><span>Ketik sekolah baru</span></label></div><select id="sp"><option value="">Memuat…</option></select><input class="inp" id="sb" placeholder="Nama sekolah lengkap" style="display:none">
 <div class="row2"><div><label>Password</label><input class="inp" id="p" type="password" autocomplete="new-password"></div><div><label>Ulangi password</label><input class="inp" id="p2" type="password" autocomplete="new-password"></div></div><button class="btn w" id="go">Daftar</button>`;
 if(tab=='up')api('sekolah').then(r=>{$('#sp').innerHTML='<option value="">'+(r.list.length?'— Pilih sekolah —':'Belum ada sekolah terdaftar, ketik sekolah baru')+'</option>'+r.list.map(s=>`<option>${esc(s)}</option>`).join('')}).catch(e=>toast('err','Gagal memuat sekolah',e.message))}
function successView(owner){$('#af').innerHTML=`<div class="sec"><div class="ic">${owner?'👑':'📨'}</div><h2 class="serif">${owner?'Akun Admin Aplikasi siap':'Pendaftaran terkirim'}</h2><p class="sub">${owner?'Anda terdeteksi sebagai pemilik aplikasi. Silakan masuk.':'Admin akan meninjau pendaftaran Anda. Anda bisa masuk setelah disetujui.'}</p><button class="btn" data-t="in">Ke halaman masuk</button></div>`}
/* ---------- SHELL ---------- */
const menu=()=>MN.filter(m=>m[4].includes(U.role));
function shell(){$('#root').innerHTML=`<header><img src="logo.png" alt=""><h1 class="gold">Aplikasi Rapor</h1><button class="bell" id="bell">🔔<b id="bc" style="display:none"></b></button><div class="chip">${esc(U.nama)}<br><small>${RL[U.role]} · ${esc(U.sekolah||'—')}</small></div><button class="btn s o" id="out">Keluar</button></header><div id="nt"></div><nav id="nav"></nav><main id="v"></main>`;
 $('#nav').innerHTML='<button data-v="home">🏠 Beranda</button>'+menu().map(m=>`<button data-v="${m[0]}">${m[2]} ${m[1]}</button>`).join('');go(view);poll();clearInterval(timer);timer=setInterval(poll,25000)}
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('#v').style.animation='none';$('#v').offsetWidth;$('#v').style.animation='';V[v]()}
async function poll(){try{const r=await api('notif');NT=r.list;const ids=new Set(NT.map(n=>n.id));
 if(seen)NT.filter(n=>!n.dibaca&&!seen.has(n.id)).forEach(n=>toast('inf','Notifikasi baru',n.pesan));seen=ids;const b=$('#bc');if(b){b.style.display=r.unread?'':'none';b.textContent=r.unread}
 if(view=='sek'||view=='app')if(NT.some(n=>!n.dibaca))0}catch(e){}}
const dt=s=>new Date(s).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
/* ---------- USER TABLE ---------- */
function utable(list){const A=U.role=='admin_app';return `<div class="tw"><table><tr><th>Nama</th><th>Email</th><th>Password</th><th>Status</th><th>Peran</th><th></th></tr>${list.map(u=>{const self=u.email==U.email,adm=u.role=='admin_app';return `<tr data-e="${esc(u.email)}"><td>${esc(u.nama)}<small>${esc(u.sekolah)}</small></td><td>${esc(u.email)}</td><td><input class="inp pw" value="${esc(u.password)}"></td>
 <td>${self||adm?`<span class="bd ${u.status}">${u.status}</span>`:`<select class="st">${['pending','approved','rejected'].map(s=>`<option${s==u.status?' selected':''}>${s}</option>`).join('')}</select>`}</td>
 <td>${A&&!self&&!adm?`<select class="rl"><option value="user"${u.role=='user'?' selected':''}>Pengguna</option><option value="admin_sekolah"${u.role=='admin_sekolah'?' selected':''}>Admin Sekolah</option></select>`:RL[u.role]}</td>
 <td style="white-space:nowrap">${u.status=='pending'?'<button class="btn s k" data-a="ok">Setujui</button> <button class="btn s r" data-a="no">Tolak</button> ':''}<button class="btn s" data-a="sv">Simpan</button></td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;color:#888;padding:24px">Belum ada pengguna.</td></tr>'}</table></div>`}
async function usave(tr,btn,force){const g=s=>(tr.querySelector(s)||{}).value;await run(btn,async()=>{await api('updateuser',{target:tr.dataset.e,newpass:g('.pw'),status:force||g('.st'),role:g('.rl')});toast('ok','Tersimpan','Perubahan pengguna berhasil disimpan.');V[view]()})}
/* ---------- VIEWS ---------- */
const V={
home(){$('#v').innerHTML=`<h2 class="serif">Halo, ${esc(U.nama.split(' ')[0])} 👋</h2><p class="sub">Pilih menu untuk memulai.</p><div class="cards">${menu().map((m,i)=>`<div class="card" data-v="${m[0]}" style="animation-delay:${i*.08}s"><div class="ic">${m[2]}</div><h3>${m[1]}</h3><p>${m[3]}</p></div>`).join('')}</div>`},
buat(){const y=new Date().getFullYear();$('#v').innerHTML=`<h2 class="serif">Buat Raport</h2><p class="sub">Isi identitas raport. Sekolah terisi otomatis.</p><div class="form"><label>Sekolah</label><input class="inp" value="${esc(U.sekolah)}" disabled><div class="row2"><div><label>Kelas</label><select id="k">${Object.keys(FASE).map(k=>`<option${k=='IV'?' selected':''}>${k}</option>`).join('')}</select></div><div><label>Rombel (opsional)</label><input class="inp" id="rb" placeholder="A / B"></div></div><div class="row2"><div><label>Fase</label><input class="inp" id="fs" value="B" disabled></div><div><label>Semester</label><select id="sm"><option>Semester 1 (Ganjil)</option><option>Semester 2 (Genap)</option></select></div></div><label>Tahun Ajaran</label><input class="inp" id="ta" value="${y}/${y+1}"><button class="btn w" id="mk">Buat Raport</button></div>`},
async saya(){$('#v').innerHTML='<h2 class="serif">Kelola Raport Saya</h2><p class="sub">Raport yang pernah Anda buat.</p><div id="pl" class="cards"></div>';try{const r=await api('projects');$('#pl').innerHTML=r.list.map((p,i)=>`<div class="card" style="animation-delay:${i*.06}s;cursor:default"><div class="ic">📘</div><h3 style="font-size:16px">${esc(p.judul)}</h3><p>${esc(p.sekolah)} · ${dt(p.dibuat)}</p><div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn s" data-a="open" data-id="${esc(p.sheetId)}" data-j="${esc(p.judul)}">Buka</button><a class="btn s o" style="text-decoration:none" target="_blank" href="${esc(p.url)}">Google Sheet</a><button class="btn s r" data-a="del" data-id="${esc(p.id)}">Hapus</button></div></div>`).join('')||'<p>Belum ada raport. Klik <b>Buat Raport</b> untuk memulai.</p>'}catch(e){toast('err','Gagal',e.message)}},
async app(){$('#v').innerHTML='<h2 class="serif">Kelola Aplikasi</h2><p class="sub">Pilih sekolah untuk melihat dan mengelola penggunanya.</p><div id="sl" class="cards"></div><div id="sd"></div>';try{const r=await api('schools');$('#sl').innerHTML=r.list.map((s,i)=>`<div class="card" data-a="sch" data-s="${esc(s.nama)}" style="animation-delay:${i*.06}s"><div class="ic">🏫</div><h3 style="font-size:16px">${esc(s.nama)}</h3><p>${s.total} pengguna · ${s.admin} admin${s.pending?` · <b style="color:#936c00">${s.pending} menunggu</b>`:''}</p></div>`).join('')||'<p>Belum ada sekolah.</p>'}catch(e){toast('err','Gagal',e.message)}},
async sek(){$('#v').innerHTML=`<h2 class="serif">Kelola Sekolah Saya</h2><p class="sub">${esc(U.sekolah)}</p><div id="ut"></div>`;try{const r=await api('users',{sekolah:U.sekolah});$('#ut').innerHTML=utable(r.list)}catch(e){toast('err','Gagal',e.message)}}};
/* ---------- GOOGLE ---------- */
function gtoken(){return new Promise((res,rej)=>{if(!window.google)return rej(new Error('Layanan Google belum siap, coba lagi.'));google.accounts.oauth2.initTokenClient({client_id:CFG.CID,scope:SCOPE,
 callback:async t=>{if(t.error)return rej(new Error('Izin Google ditolak.'));try{const i=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+t.access_token}})).json();
  if((i.email||'').toLowerCase()!=U.email.toLowerCase())return rej(new Error('Akun Google ('+i.email+') berbeda dengan email terdaftar ('+U.email+'). Pilih akun yang sama.'));
  sessionStorage.gt=JSON.stringify({token:t.access_token,exp:Date.now()+3300e3});res(t.access_token)}catch(e){rej(e)}},error_callback:()=>rej(new Error('Jendela izin Google ditutup.'))}).requestAccessToken({login_hint:U.email})})}
async function create(f){const tk=await gtoken(),H={Authorization:'Bearer '+tk,'Content-Type':'application/json'},judul=`Kelas ${f.k} · Fase ${FASE[f.k]} · ${f.sm} · TA ${f.ta}`;
 const r=await(await fetch('https://sheets.googleapis.com/v4/spreadsheets',{method:'POST',headers:H,body:JSON.stringify({properties:{title:'Rapor · '+judul},sheets:Object.keys(HD).map(t=>({properties:{title:t}}))})})).json();if(r.error)throw new Error(r.error.message);
 const data=Object.keys(HD).map(t=>({range:t+'!A1',values:[HD[t]].concat(t=='Profil'?[['sekolah',U.sekolah],['kelas',f.k],['rombel',f.rb],['semester',f.sm],['ta',f.ta]]:t=='Mapel'?MAPEL.map((m,i)=>['M'+(i+1),m,70,'','','','']):[])}));
 const w=await(await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${r.spreadsheetId}/values:batchUpdate`,{method:'POST',headers:H,body:JSON.stringify({valueInputOption:'RAW',data})})).json();if(w.error)throw new Error(w.error.message);
 const p={judul,sheetId:r.spreadsheetId,url:r.spreadsheetUrl};await api('addproject',p);return p}
const openEd=p=>{sessionStorage.proj=JSON.stringify({sheetId:p.sheetId,judul:p.judul});location.href='editor.html'};
/* ---------- EVENTS ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-t],[data-v],[data-a],#go,#mk,#bell,#out,#cc,#cn');if(!t){if(!e.target.closest('#nt'))$('#nt')&&($('#nt').style.display='none');return}
 if(t.dataset.t&&!t.dataset.a){const x=t.dataset.t;authView(x)}
 else if(t.id=='go'&&!U){const g=i=>($('#'+i)||{}).value||'';
