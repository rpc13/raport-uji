<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aplikasi Rapor Kurikulum Merdeka</title>
<style>
:root{--n:#1B2A49;--t:#2A9D8F;--y:#FFF6D6;--g:#EEF2F7;--l:#B8C2CC}
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#f6f8fb;color:#222}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 6px 24px #0002;text-align:center}
#login h1{color:var(--n);font-size:20px;margin:0 0 4px}input,select,button{font:inherit}
input,select{width:100%;padding:7px 8px;border:1px solid var(--l);border-radius:6px;background:var(--y)}
.b{background:var(--t);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;margin:8px 4px 0 0}.b.n{background:var(--n)}
#app{display:none}header{background:var(--n);color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}header button{background:var(--t);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--l)}
nav button{background:var(--g);border:0;padding:7px 12px;border-radius:20px;cursor:pointer}nav button.on{background:var(--t);color:#fff;font-weight:700}
main{padding:18px;max-width:1150px;margin:auto}h2{color:var(--n);margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:#fff;border:0;border-radius:14px;padding:22px 10px;box-shadow:0 2px 10px #0001;cursor:pointer;font-size:30px;display:flex;flex-direction:column;gap:8px;align-items:center}.card b{font-size:14px;color:var(--n)}.card:hover{background:var(--t)}.card:hover b{color:#fff}
.tw{overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 10px #0001}table{border-collapse:collapse;width:100%}th{background:var(--n);color:#fff;padding:8px;font-size:12px;position:sticky;top:0}td{border:1px solid var(--l);padding:3px;min-width:70px}td input,td select{border:0;background:var(--y)}td.c{background:var(--g);text-align:center;font-weight:700;padding:6px}td.d{background:var(--g);font-size:11px;min-width:260px}
.x{background:0;border:0;color:#c00;cursor:pointer}.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;background:#fff;padding:16px;border-radius:10px}.f label{font-weight:700;font-size:12px;color:var(--n)}
.r{background:#fff;max-width:760px;margin:auto;padding:24px;border:1px solid var(--l)}.r h3{text-align:center;background:var(--n);color:#fff;margin:0;padding:10px}.r .s{text-align:center;background:var(--t);color:#fff;padding:5px;margin-bottom:10px}.r table td{padding:5px;font-size:12px}.r th{position:static}.r h4{margin:12px 0 4px;color:var(--n)}.sg{display:flex;justify-content:space-between;margin-top:20px;text-align:center}
#toast{position:fixed;bottom:18px;right:18px;background:var(--n);color:#fff;padding:10px 16px;border-radius:8px;display:none}
@media print{header,nav,.np,#toast{display:none}body{background:#fff}main{padding:0}.r{border:0}}
</style></head><body>
<div id="login"><h1>Aplikasi Rapor</h1><p style="color:#666;margin:0 0 14px">Kurikulum Merdeka (SD)</p><input id="un" type="text" placeholder="Username" autocomplete="username" style="margin-bottom:8px"><div style="display:flex;gap:6px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="b n" id="eye" type="button" style="margin:0" title="Tampilkan/sembunyikan">👁</button></div><button class="b n" id="go" type="button">Masuk</button><p id="err" style="color:#c00"></p></div>
<div id="app"><header><h1>📘 Aplikasi Rapor</h1><span id="st"></span><span id="who" style="font-size:12px"></span><button id="save">💾 Simpan</button><button id="out" style="background:#555">Keluar</button></header><nav id="nav"></nav><main id="main"></main></div><div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyxzVD07M1KhJplC-6d53LZ2crSyt8CIIhiui9rQCExNRo4k6UkHe1oso_rbWJO40nE/exec'; // URL deployment Apps Script (berakhiran /exec)
const FASE={I:'A',II:'A',III:'B',IV:'B',V:'C',VI:'C'},PRK=['Sangat Baik','Baik','Cukup','Kurang'],FR={'Sangat Baik':'sangat baik',Baik:'baik',Cukup:'cukup',Kurang:'masih perlu bimbingan'};
const DIM=['Keimanan dan Ketakwaan terhadap Tuhan YME','Kewargaan','Penalaran Kritis','Kreativitas','Kolaborasi','Kemandirian','Kesehatan','Komunikasi'];
const PRED=[[90,'A','yang sangat baik'],[80,'B','yang baik'],[70,'C','yang cukup'],[0,'D','yang masih perlu pendampingan']];
const MENU0=[['profil','Profil Sekolah','🏫'],['siswa','Data Murid','🧑‍🎓'],['mapel','Mapel dan TP','📚'],['nilai','Input Nilai','✍️'],['koku','Ko-kurikuler','🌱'],['catatan','Absen dan Catatan','📝'],['leger','Leger','📊'],['rapor','Cetak Rapor','🖨️']];
const MENU=()=>S.role==='admin'?[...MENU0,['users','Pengguna','🔑']]:MENU0;
const PF=[['sekolah','Nama Sekolah'],['npsn','NPSN'],['alamat','Alamat'],['kelurahan','Kelurahan'],['kecamatan','Kecamatan'],['kota','Kabupaten/Kota'],['provinsi','Provinsi'],['telp','Telepon'],['ta','Tahun Ajaran'],['semester','Semester',['1 (Ganjil)','2 (Genap)']],['kelas','Kelas',Object.keys(FASE)],['rombel','Rombel'],['kepsek','Kepala Sekolah'],['nipkepsek','NIP Kepala Sekolah'],['wali','Wali Kelas'],['nipwali','NIP Wali Kelas'],['tempat','Tempat, Tanggal Rapor']];
let S={},pw=sessionStorage.pw||'',user=sessionStorage.user||'',tab='home',cm='',cs='',dirty=new Set();
const $=q=>document.querySelector(q),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'),num=v=>v===''||v==null?null:Number(v);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};
async function call(b){const r=await fetch(API,{method:'POST',body:JSON.stringify({user,key:pw,...b})});return r.json()}
async function login(){$('#err').textContent='';if(API.startsWith('GANTI')){$('#err').textContent='Isi dulu konstanta API di index.html';return}
 user=$('#un').value.trim()||user;pw=$('#pw').value||pw;try{const r=await call({action:'load'});if(r.error){$('#err').textContent=r.error;return}S=r.data;S.role=r.role;sessionStorage.pw=pw;sessionStorage.user=user;$('#who').textContent='👤 '+r.nama+' ('+r.role+')';
 while(S.Kegiatan.length<3)S.Kegiatan.push({no:S.Kegiatan.length+1});S.Mapel.length&&(cm=S.Mapel[0].kode);$('#login').style.display='none';$('#app').style.display='block';nav();show('home')}catch(e){$('#err').textContent='Gagal terhubung: '+e}}
$('#go').addEventListener('click',login);
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#un').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pw').focus()});
$('#eye').addEventListener('click',()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'});
$('#out').addEventListener('click',()=>{sessionStorage.clear();location.reload()});
if(pw&&user&&!API.startsWith('GANTI'))login();
$('#save').onclick=async()=>{for(const s of dirty){const r=await call({action:'save',sheet:s,rows:S[s]});if(r.error)return toast(r.error)}dirty.clear();$('#st').textContent='';toast('Tersimpan di Google Sheet')};
const P=k=>(S.Profil.find(x=>x.key===k)||{}).value||'',setP=(k,v)=>{let r=S.Profil.find(x=>x.key===k);r?r.value=v:S.Profil.push({key:k,value:v})};
function nav(){$('#nav').innerHTML='<button data-go="home">🏠 Home</button>'+MENU().map(m=>`<button data-go="${m[0]}">${m[2]} ${m[1]}</button>`).join('')}
function show(t){tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===t));$('#main').innerHTML=V[t]()}
const sis=id=>S.Siswa.find(s=>s.id==id)||{},crow=id=>{let r=S.Catatan.find(x=>x.sid==id);if(!r){r={sid:id};S.Catatan.push(r)}return r},
nrow=(id,m)=>{let r=S.Nilai.find(x=>x.sid==id&&x.mapel==m);if(!r){r={sid:id,mapel:m};S.Nilai.push(r)}return r},pr=n=>PRED.find(p=>n>=p[0]);
function calc(id,m){const r=S.Nilai.find(x=>x.sid==id&&x.mapel==m.kode)||{},t=[1,2,3,4].map(i=>num(r['tp'+i])),v=t.filter(x=>x!=null);if(!v.length)return{};
 const avg=v.reduce((a,b)=>a+b)/v.length,sas=num(r.sas),na=sas==null?null:Math.round(avg*(.6)+sas*.4),mx=Math.max(...v),mn=Math.min(...v),tn=i=>m['tp'+(i+1)]||'TP '+(i+1);
 return{na,p:na==null?'':pr(na)[1],d:`Ananda ${sis(id).nama} menunjukkan penguasaan ${pr(mx)[2]} dalam ${tn(t.indexOf(mx))}.`+(mn<mx&&mn<num(m.kkm||70)?` Perlu bimbingan lebih lanjut dalam ${tn(t.indexOf(mn))}.`:'')}}
function fld(a,t,o,v){v=v??'';return o?`<select ${a}><option></option>${o.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input ${a} type="${t||'text'}" value="${esc(v)}">`}
function grid(s,cols){return `<div class="tw"><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>${S[s].map((r,i)=>`<tr>${cols.map(c=>`<td>${fld(`data-s="${s}" data-i="${i}" data-k="${c[0]}"`,c[2],c[3],r[c[0]])}</td>`).join('')}<td><button class="x" data-del="${s}:${i}">✕</button></td></tr>`).join('')}</table></div><button class="b np" data-add="${s}">+ Tambah baris</button>`}
const msel=()=>`<select id="msel" style="max-width:320px">${S.Mapel.map(m=>`<option value="${m.kode}"${m.kode==cm?' selected':''}>${esc(m.nama)}</option>`).join('')}</select>`;
const V={home:()=>`<h2>Menu Utama</h2><p>${esc(P('sekolah'))||'<i>Isi profil sekolah dulu</i>'} · Kelas ${esc(P('kelas'))} ${esc(P('rombel'))} · Fase ${FASE[P('kelas')]||'-'} · ${esc(P('semester'))} · TA ${esc(P('ta'))}</p><div class="cards">${MENU().map(m=>`<button class="card" data-go="${m[0]}">${m[2]}<b>${m[1]}</b></button>`).join('')}</div>`,
profil:()=>`<h2>Profil Sekolah dan Kelas</h2><div class="f">${PF.map(([k,l,o])=>`<div><label>${l}</label>${fld(`data-p="${k}"`,'',o,P(k))}</div>`).join('')}<div><label>Fase (otomatis)</label><input disabled value="${FASE[P('kelas')]||''}"></div></div>`,
users:()=>`<h2>Kelola Pengguna</h2><p>Password tampil apa adanya dan tersimpan di sheet <b>Users</b> pada Google Sheet. Harus ada minimal satu admin. Klik Simpan setelah mengubah.</p>`+grid('Users',[['username','Username'],['password','Password'],['role','Peran','',['admin','guru']],['nama','Nama']]),
siswa:()=>`<h2>Data Murid (${S.Siswa.length})</h2>`+grid('Siswa',[['nama','Nama Lengkap'],['nis','NIS'],['nisn','NISN'],['jk','L/P','',['L','P']],['agama','Agama'],['ortu','Orang Tua/Wali']]),
mapel:()=>`<h2>Mata Pelajaran dan Tujuan Pembelajaran</h2><p>Tulis TP sebagai frasa lanjutan kalimat, misalnya: menjelaskan siklus air dan dampaknya.</p>`+grid('Mapel',[['nama','Mata Pelajaran'],['kkm','KKM','number'],['tp1','TP 1'],['tp2','TP 2'],['tp3','TP 3'],['tp4','TP 4']]),
nilai:()=>{const m=S.Mapel.find(x=>x.kode==cm);if(!m)return'<p>Tambah mapel dulu.</p>';return `<h2>Input Nilai</h2>${msel()}<p>KKM ${m.kkm||70}. Nilai akhir = 60% rata-rata TP + 40% SAS.</p><div class="tw"><table><tr><th>Nama</th>${[1,2,3,4].map(i=>`<th>TP ${i}<br><small>${esc(m['tp'+i])}</small></th>`).join('')}<th>SAS</th><th>Nilai Akhir</th><th>Pred.</th><th>Deskripsi (otomatis)</th></tr>${S.Siswa.map(s=>{const r=S.Nilai.find(x=>x.sid==s.id&&x.mapel==cm)||{},c=calc(s.id,m);return `<tr><td class="c" style="text-align:left">${esc(s.nama)}</td>${['tp1','tp2','tp3','tp4','sas'].map(k=>`<td>${fld(`data-n="1" data-sid="${s.id}" data-k="${k}" min="0" max="100"`,'number',0,r[k])}</td>`).join('')}<td class="c" id="na${s.id}" style="${c.na<(m.kkm||70)?'color:#c00':''}">${c.na??''}</td><td class="c" id="pd${s.id}">${c.p||''}</td><td class="d" id="ds${s.id}">${esc(c.d)}</td></tr>`}).join('')}</table></div>`},
koku:()=>`<h2>Ko-kurikuler</h2><p>Delapan dimensi profil lulusan. Isi tema dan dimensi kegiatan (maksimal 3), lalu predikat tiap murid.</p>`+kgrid()+`<h3>Predikat Murid</h3><div class="tw"><table><tr><th>Nama</th>${[1,2,3].map(i=>`<th>Kegiatan ${i}<br><small>${esc((S.Kegiatan[i-1]||{}).tema)}</small></th>`).join('')}</tr>${S.Siswa.map(s=>{const c=crow(s.id);return `<tr><td class="c" style="text-align:left">${esc(s.nama)}</td>${['k1','k2','k3'].map(k=>`<td>${fld(`data-c="1" data-sid="${s.id}" data-k="${k}"`,'',PRK,c[k])}</td>`).join('')}</tr>`}).join('')}</table></div>`,
catatan:()=>`<h2>Absen, Ekstrakurikuler, dan Catatan Wali Kelas</h2><div class="tw"><table><tr><th>Nama</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Ekskul</th><th>Predikat</th><th>Catatan Wali Kelas</th></tr>${S.Siswa.map(s=>{const c=crow(s.id),a=k=>`data-c="1" data-sid="${s.id}" data-k="${k}"`;return `<tr><td class="c" style="text-align:left">${esc(s.nama)}</td>${['sakit','izin','alpa'].map(k=>`<td>${fld(a(k),'number',0,c[k])}</td>`).join('')}<td>${fld(a('ekskul'),'',0,c.ekskul)}</td><td>${fld(a('pekskul'),'',['Sangat Baik','Baik','Cukup','Kurang'],c.pekskul)}</td><td style="min-width:260px">${fld(a('catatan'),'',0,c.catatan)}</td></tr>`}).join('')}</table></div>`,
leger:()=>{const rows=S.Siswa.map(s=>{const n=S.Mapel.map(m=>calc(s.id,m).na),v=n.filter(x=>x!=null),sum=v.reduce((a,b)=>a+b,0);return{s,n,sum,avg:v.length?sum/v.length:null}}),av=rows.map(r=>r.avg).filter(x=>x!=null);
 return `<h2>Leger Nilai Akhir</h2><div class="tw"><table><tr><th>No</th><th>Nama</th>${S.Mapel.map(m=>`<th>${esc(m.nama)}</th>`).join('')}<th>Jumlah</th><th>Rata-rata</th><th>Peringkat</th></tr>${rows.map((r,i)=>`<tr><td class="c">${i+1}</td><td>${esc(r.s.nama)}</td>${r.n.map(x=>`<td class="c">${x??''}</td>`).join('')}<td class="c">${r.avg==null?'':r.sum}</td><td class="c">${r.avg==null?'':r.avg.toFixed(1)}</td><td class="c">${r.avg==null?'':av.filter(a=>a>r.avg).length+1}</td></tr>`).join('')}</table></div>`},
rapor:()=>{const s=sis(cs)||{};const opt=`<select id="ssel" style="max-width:320px"><option value="">Pilih murid</option>${S.Siswa.map(x=>`<option value="${x.id}"${x.id==cs?' selected':''}>${esc(x.nama)}</option>`).join('')}</select>`;
 if(!cs)return `<h2>Cetak Rapor</h2>${opt}`;const c=crow(cs),k=P('kelas'),ms=S.Mapel.map(m=>({m,c:calc(cs,m)})),v=ms.map(x=>x.c.na).filter(x=>x!=null);
 return `<div class="np"><h2>Cetak Rapor</h2>${opt}<button class="b" onclick="print()">🖨️ Cetak / Simpan PDF</button></div><div class="r"><h3>LAPORAN HASIL BELAJAR (RAPOR)</h3><div class="s">${esc(P('sekolah')).toUpperCase()}</div>
 <table><tr><td><b>Nama</b></td><td>${esc(s.nama)}</td><td><b>Kelas / Fase</b></td><td>${esc(k)} ${esc(P('rombel'))} / ${FASE[k]||''}</td></tr><tr><td><b>NIS / NISN</b></td><td>${esc(s.nis)} / ${esc(s.nisn)}</td><td><b>Semester / TA</b></td><td>${esc(P('semester'))} / ${esc(P('ta'))}</td></tr></table>
 <h4>Capaian Mata Pelajaran</h4><table><tr><th>No</th><th>Mata Pelajaran</th><th>Nilai</th><th>Pred.</th><th>Capaian Kompetensi</th></tr>${ms.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.m.nama)}</b></td><td align="center">${x.c.na??''}</td><td align="center">${x.c.p||''}</td><td style="font-size:11px">${esc(x.c.d)}</td></tr>`).join('')}<tr><td colspan="2" align="right"><b>Rata-rata</b></td><td align="center"><b>${v.length?(v.reduce((a,b)=>a+b)/v.length).toFixed(1):''}</b></td><td colspan="2"></td></tr></table>
 <h4>Ko-kurikuler</h4><table><tr><th>Kegiatan</th><th>Predikat</th><th>Dimensi dan Capaian</th></tr>${[0,1,2].filter(i=>(S.Kegiatan[i]||{}).tema).map(i=>{const g=S.Kegiatan[i],p=c['k'+(i+1)],d=[g.dim1,g.dim2].filter(Boolean).join(', ');return `<tr><td><b>${esc(g.tema)}</b></td><td align="center">${esc(p)}</td><td style="font-size:11px">${p?`Ananda ${esc(s.nama)} menunjukkan capaian ${FR[p]} dalam kegiatan ${esc(g.tema)}${d?' pada dimensi '+esc(d):''}.`:''}</td></tr>`}).join('')}</table>
 <h4>Ekstrakurikuler dan Ketidakhadiran</h4><table><tr><td>${esc(c.ekskul)||'-'}: ${esc(c.pekskul)||'-'}</td><td>Sakit ${c.sakit||0} hari · Izin ${c.izin||0} hari · Alpa ${c.alpa||0} hari</td></tr></table>
 <h4>Catatan Wali Kelas</h4><table><tr><td style="height:46px">${esc(c.catatan)}</td></tr></table>
 <div style="text-align:right;margin-top:14px">${esc(P('tempat'))}</div><div class="sg"><div>Orang Tua/Wali<br><br><br><br>(................)</div><div>Wali Kelas<br><br><br><br><b><u>${esc(P('wali'))}</u></b><br>NIP. ${esc(P('nipwali'))}</div></div><div style="text-align:center;margin-top:14px">Mengetahui, Kepala Sekolah<br><br><br><br><b><u>${esc(P('kepsek'))}</u></b><br>NIP. ${esc(P('nipkepsek'))}</div></div>`}};
function kgrid(){return `<div class="tw"><table><tr><th>No</th><th>Tema / Kegiatan</th><th>Dimensi 1</th><th>Dimensi 2</th><th>Deskripsi</th></tr>${S.Kegiatan.map((r,i)=>`<tr><td class="c">${i+1}</td>${[['tema'],['dim1',DIM],['dim2',DIM],['desk']].map(([k,o])=>`<td>${fld(`data-s="Kegiatan" data-i="${i}" data-k="${k}"`,'',o,r[k])}</td>`).join('')}</tr>`).join('')}</table></div>`}
const M=$('#main');
M.addEventListener('input',e=>{const d=e.target.dataset,v=e.target.value,mk=()=>{dirty.add(d.s);$('#st').textContent='● belum disimpan'};
 if(d.p){setP(d.p,v);dirty.add('Profil');$('#st').textContent='● belum disimpan'}
 else if(d.s){S[d.s][d.i][d.k]=v;mk()}
 else if(d.n){nrow(d.sid,cm)[d.k]=v;dirty.add('Nilai');$('#st').textContent='● belum disimpan';const m=S.Mapel.find(x=>x.kode==cm),c=calc(d.sid,m);$('#na'+d.sid).textContent=c.na??'';$('#pd'+d.sid).textContent=c.p||'';$('#ds'+d.sid).textContent=c.d||''}
 else if(d.c){crow(d.sid)[d.k]=v;dirty.add('Catatan');$('#st').textContent='● belum disimpan'}});
M.addEventListener('change',e=>{if(e.target.id==='msel'){cm=e.target.value;show('nilai')}if(e.target.id==='ssel'){cs=e.target.value;show('rapor')}if(e.target.dataset.p==='kelas')show('profil')});
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-add],[data-del]');if(!t)return;const d=t.dataset;
 if(d.go)show(d.go);
 if(d.add){const s=d.add;S[s].push(s==='Users'?{role:'guru'}:s==='Siswa'?{id:'S'+Date.now()}:s==='Mapel'?{kode:'M'+Date.now()}:{});dirty.add(s);show(tab)}
 if(d.del){const[s,i]=d.del.split(':');if(confirm('Hapus baris ini?')){S[s].splice(i,1);dirty.add(s);show(tab)}}});
</script></body></html>
